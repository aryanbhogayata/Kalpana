<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Kawaii Kitty</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            /* A dreamy, cute pastel gradient background */
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            overflow: hidden;
            touch-action: manipulation;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes float-heart {
            0% { transform: translateY(0) scale(0.5) rotate(-10deg); opacity: 1; }
            100% { transform: translateY(-150px) scale(1.5) rotate(20deg); opacity: 0; }
        }

        @keyframes blink {
            0%, 4%, 100% { transform: scaleY(1); }
            2% { transform: scaleY(0.1); }
        }

        @keyframes ear-twitch {
            0%, 100% { transform: rotate(0deg); }
            5% { transform: rotate(-10deg); }
            10% { transform: rotate(5deg); }
            15% { transform: rotate(0deg); }
        }

        .cat-container {
            animation: float 4s ease-in-out infinite;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cat-container:hover {
            transform: scale(1.05);
        }

        .cat-container:active {
            transform: scale(0.95);
        }

        /* SVG specific classes for internal animations */
        .blinking {
            transform-origin: center;
            animation: blink 4s infinite;
        }

        .ear-left {
            transform-origin: 20% 20%;
            animation: ear-twitch 7s infinite 2s; /* Delayed twitch */
        }

        .ear-right {
            transform-origin: 80% 20%;
            animation: ear-twitch 5s infinite;
        }

        .heart {
            position: absolute;
            color: #ff6b81;
            font-size: 2rem;
            pointer-events: none;
            z-index: 5;
            animation: float-heart 2s ease-out forwards;
            filter: drop-shadow(0 4px 6px rgba(255, 107, 129, 0.3));
        }

        /* Smooth pupil transitions to prevent jittering */
        #left-pupil, #right-pupil {
            transition: transform 0.1s ease-out;
        }

        /* Hidden class for toggling SVG elements */
        .hidden-face {
            display: none;
        }

        /* Sparkle effect on the background */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center m-0 relative">

    <!-- Decorative background elements -->
    <div id="sparkle-container" class="absolute inset-0 z-0"></div>

    <div class="z-20 text-center mb-8 pointer-events-none">
        <h1 class="text-4xl md:text-5xl font-bold text-white drop-shadow-md mb-2 tracking-wide">
            Kawaii Kitty
        </h1>
        <p class="text-white text-lg md:text-xl opacity-90 font-medium drop-shadow-sm">
            Move your mouse! Click or tap to pet.
        </p>
    </div>

    <div class="cat-container w-64 h-64 md:w-80 md:h-80" id="cat-buddy">
        <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-2xl">
            <!-- Tail (in back) -->
            <path d="M 230 250 Q 280 250 280 200 Q 280 180 260 170 Q 240 160 220 180" fill="none" stroke="#fff" stroke-width="25" stroke-linecap="round" />
            
            <!-- Body -->
            <ellipse cx="150" cy="240" rx="90" ry="60" fill="#ffffff" />
            
            <!-- Left Ear -->
            <g class="ear-left">
                <path d="M 70 120 L 30 30 L 120 70 Z" fill="#ffffff" />
                <path d="M 68 100 L 45 45 L 105 75 Z" fill="#ffb7b2" />
            </g>

            <!-- Right Ear -->
            <g class="ear-right">
                <path d="M 230 120 L 270 30 L 180 70 Z" fill="#ffffff" />
                <path d="M 232 100 L 255 45 L 195 75 Z" fill="#ffb7b2" />
            </g>

            <!-- Head -->
            <ellipse cx="150" cy="150" rx="110" ry="90" fill="#ffffff" />

            <!-- Blush -->
            <circle cx="80" cy="180" r="16" fill="#ffb7b2" opacity="0.6" />
            <circle cx="220" cy="180" r="16" fill="#ffb7b2" opacity="0.6" />

            <!-- Nose -->
            <polygon points="140,175 160,175 150,185" fill="#ffb7b2" />

            <!-- Default Mouth -->
            <g id="mouth-default" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round">
                <path d="M 150 185 Q 135 200 120 190" />
                <path d="M 150 185 Q 165 200 180 190" />
            </g>

            <!-- Happy Mouth (Hidden initially) -->
            <g id="mouth-happy" class="hidden-face" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round">
                <path d="M 120 185 Q 150 215 180 185" />
                <path d="M 130 185 L 170 185" stroke-width="2" />
                <path d="M 150 185 Q 150 205 165 200" fill="#ffb7b2" opacity="0.8" stroke="none" /> <!-- little tongue -->
            </g>

            <!-- Default Eyes Group -->
            <g id="eyes-default" class="blinking">
                <!-- Left Eye Base -->
                <circle cx="100" cy="140" r="22" fill="#333" />
                <!-- Left Pupil / Glints (Movable) -->
                <g id="left-pupil">
                    <circle cx="104" cy="136" r="8" fill="#fff" />
                    <circle cx="94" cy="146" r="3" fill="#fff" />
                </g>

                <!-- Right Eye Base -->
                <circle cx="200" cy="140" r="22" fill="#333" />
                <!-- Right Pupil / Glints (Movable) -->
                <g id="right-pupil">
                    <circle cx="204" cy="136" r="8" fill="#fff" />
                    <circle cx="194" cy="146" r="3" fill="#fff" />
                </g>
            </g>

            <!-- Happy Eyes Group (Hidden initially, shown on click) -->
            <g id="eyes-happy" class="hidden-face" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round">
                <path d="M 80 145 Q 100 120 120 145" />
                <path d="M 180 145 Q 200 120 220 145" />
            </g>

            <!-- Paws -->
            <ellipse cx="110" cy="260" rx="20" ry="25" fill="#ffffff" />
            <ellipse cx="190" cy="260" rx="20" ry="25" fill="#ffffff" />
            <path d="M 105 275 L 105 285 M 115 275 L 115 285" stroke="#eee" stroke-width="3" stroke-linecap="round" />
            <path d="M 185 275 L 185 285 M 195 275 L 195 285" stroke="#eee" stroke-width="3" stroke-linecap="round" />
        </svg>
    </div>

    <script>
        // --- 1. Background Generation ---
        const sparkleContainer = document.getElementById('sparkle-container');
        for (let i = 0; i < 30; i++) {
            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            const size = Math.random() * 4 + 2;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.left = `${Math.random() * 100}vw`;
            sparkle.style.top = `${Math.random() * 100}vh`;
            // Random floating animation for sparkles
            sparkle.style.animation = `float ${Math.random() * 3 + 2}s ease-in-out infinite alternate`;
            sparkle.style.animationDelay = `${Math.random() * 2}s`;
            sparkleContainer.appendChild(sparkle);
        }

        // --- 2. Interactive Eye Tracking Logic ---
        const cat = document.getElementById('cat-buddy');
        const leftPupil = document.getElementById('left-pupil');
        const rightPupil = document.getElementById('right-pupil');
        
        let isPetting = false; // Flag to stop eye tracking during the "happy" state

        function updateEyes(clientX, clientY) {
            if (isPetting) return;

            // Get cat's bounding box to find its center on the screen
            const rect = cat.getBoundingClientRect();
            
            // Cat's center coordinates
            const catCenterX = rect.left + rect.width / 2;
            const catCenterY = rect.top + rect.height / 2;

            // Calculate distance and angle from cat center to cursor
            const deltaX = clientX - catCenterX;
            const deltaY = clientY - catCenterY;
            const angle = Math.atan2(deltaY, deltaX);
            
            // Max distance the pupil should travel from the center of the eye
            const maxRadius = 6; 
            
            // Calculate how far to push the pupil (caps at maxRadius)
            const distance = Math.min(Math.sqrt(deltaX * deltaX + deltaY * deltaY) * 0.02, maxRadius);

            // Calculate exact X and Y translation
            const moveX = Math.cos(angle) * distance;
            const moveY = Math.sin(angle) * distance;

            // Apply translation to both pupils
            leftPupil.style.transform = `translate(${moveX}px, ${moveY}px)`;
            rightPupil.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }

        // Listen for both mouse and touch movements
        document.addEventListener('mousemove', (e) => {
            updateEyes(e.clientX, e.clientY);
        });

        document.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                updateEyes(e.touches[0].clientX, e.touches[0].clientY);
            }
        });

        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playMeowSound() {
            if (!audioCtx) return;
            
            // Create a custom synthesized "meow/purr" sound
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // Triangle wave gives a softer, somewhat vocal timbre
            osc.type = 'triangle';
            
            // Frequency glissando (slide) to simulate a meow inflection
            osc.frequency.setValueAtTime(400, audioCtx.currentTime); // Start pitch
            osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.3); // Pitch up
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.6); // Pitch down
            
            // Volume envelope to make it fade in and out smoothly
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1); // Attack
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6); // Release
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        const eyesDefault = document.getElementById('eyes-default');
        const eyesHappy = document.getElementById('eyes-happy');
        const mouthDefault = document.getElementById('mouth-default');
        const mouthHappy = document.getElementById('mouth-happy');

        function petCat(e) {
            initAudio();
            playMeowSound();
            
            isPetting = true;

            // Toggle facial expression SVG elements
            eyesDefault.classList.add('hidden-face');
            eyesHappy.classList.remove('hidden-face');
            mouthDefault.classList.add('hidden-face');
            mouthHappy.classList.remove('hidden-face');
            
            // Center pupils for when the default eyes return
            leftPupil.style.transform = `translate(0px, 0px)`;
            rightPupil.style.transform = `translate(0px, 0px)`;

            // Spawn cute floating hearts
            spawnHearts(e);

            // Revert back to normal state after 1.5 seconds
            setTimeout(() => {
                eyesDefault.classList.remove('hidden-face');
                eyesHappy.classList.add('hidden-face');
                mouthDefault.classList.remove('hidden-face');
                mouthHappy.classList.add('hidden-face');
                isPetting = false;
            }, 1500);
        }

        function spawnHearts(e) {
            // Determine spawn location (either from mouse click or center of cat)
            let originX = window.innerWidth / 2;
            let originY = window.innerHeight / 2;
            
            if (e && e.clientX) {
                originX = e.clientX;
                originY = e.clientY - 50; // slightly above the cursor
            } else if (e && e.touches && e.touches.length > 0) {
                originX = e.touches[0].clientX;
                originY = e.touches[0].clientY - 50;
            }

            // Spawn 3-5 hearts
            const numHearts = Math.floor(Math.random() * 3) + 3;
            
            for (let i = 0; i < numHearts; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤'; // Heart emoji/character
                heart.className = 'heart';
                
                // Slight randomization for position
                const offsetX = (Math.random() - 0.5) * 60;
                heart.style.left = `${originX + offsetX}px`;
                heart.style.top = `${originY}px`;
                
                // Slight randomization for animation duration and delay
                heart.style.animationDuration = `${1.5 + Math.random() * 1}s`;
                
                document.body.appendChild(heart);
                
                // Clean up DOM after animation completes
                setTimeout(() => {
                    heart.remove();
                }, 2500);
            }
        }

        // Attach click and touch events to the cat container
        cat.addEventListener('mousedown', petCat);
        cat.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent double firing from simulated mousedown
            petCat(e);
        });

    </script>
</body>
</html>
